name: mylanfiles_server
description: >-
  MyLanFiles embedded HTTP(S) server and its protocol peer client (pinning,
  pairing, packed stream). Depends on mylanfiles_core.
publish_to: none
environment:
  sdk: ^3.11.0
resolution: workspace
dependencies:
  mylanfiles_core:
    path: ../mylanfiles_core
  basic_utils: ^5.7.0
  crypto: ^3.0.0
  http: ^1.2.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
dev_dependencies:
  test: ^1.25.0
