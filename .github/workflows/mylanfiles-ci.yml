# MyLanFiles CI gate (separate file so upstream's own workflows stay untouched).
# Scope: the mylanfiles_* Dart packages (pure Dart, fast on both runners).
# Upstream app keeps localsend's own CI.
name: mylanfiles-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          flutter-version: 3.47.5 # dev parity: gradle/kotlin minimums and Dart features were validated on this version

      - name: Pub get (workspace)
        run: dart pub get

      - name: Format
        run: |
          dart format --set-exit-if-changed packages/mylanfiles_core
          dart format --set-exit-if-changed packages/mylanfiles_server

      - name: Analyze
        run: |
          dart analyze packages/mylanfiles_core
          dart analyze packages/mylanfiles_server

      - name: App analyze (mylanfiles surface)
        run: flutter analyze app

      - name: App unit tests (mylanfiles)
        run: flutter test app/test/unit/pages/mylanfiles

      - name: Test (core)
        working-directory: packages/mylanfiles_core
        run: dart test

      - name: Test (server)
        working-directory: packages/mylanfiles_server
        run: dart test
